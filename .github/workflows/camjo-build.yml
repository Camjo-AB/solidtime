# Camjo: builds the solidtime image for time.camjo.com and pushes it to GHCR.
# Tag a release on the camjo branch as v<upstream>-camjo.<n>, e.g. v0.21.0-camjo.1.
on:
  push:
    branches:
      - camjo
    tags:
      - 'v*-camjo.*'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  GHCR_REPO: ghcr.io/camjo-ab/solidtime

name: Camjo - Build image
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: "Check out code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Get version"
        id: release-version
        run: |
          # The fork has no upstream release tags; fetch them so describe finds the base version.
          git fetch --quiet --tags https://github.com/solidtime-io/solidtime.git
          echo "app_version=$(git describe --tags --match 'v*' | cut -c 2-)" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Copy .env template for production"
        run: |
          cp .env.production .env
          rm .env.production .env.ci .env.example
          sed -i 's/APP_VERSION=0.0.0/APP_VERSION=${{ steps.release-version.outputs.app_version }}/g' .env
          sed -i 's/APP_BUILD=0/APP_BUILD=${{ steps.release-version.outputs.build }}/g' .env

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pgsql

      - name: "Install dependencies"
        run: composer install --no-dev --no-ansi --no-interaction --prefer-dist --ignore-platform-reqs --classmap-authoritative

      - name: "Use Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: "Install npm dependencies"
        run: npm ci

      - name: "Build"
        run: npm run build

      - name: "Docker meta"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_REPO }}
          tags: |
            type=ref,event=branch
            type=match,pattern=v(.*),group=1
            type=sha,format=short

      - name: "Login to GHCR"
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/prod/Dockerfile
          build-args: |
            DOCKER_FILES_BASE_PATH=docker/prod/
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
